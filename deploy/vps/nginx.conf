server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Contact form + public config (PHP-FPM)
    location ~ ^/assets/php/[^/]+\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass marketing-php:9000;
        fastcgi_read_timeout 60s;
    }

    # Block other PHP under the site
    location ~ \.php$ {
        return 404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
