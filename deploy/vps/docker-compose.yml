# Marketing site — static HTML for qubextrack.com / www.qubextrack.com
# Install: copy this folder to /opt/marketing-site on the VPS
# Sync site files into ./public (CI/CD does this via Deploy workflows)
# Requires: docker network create edge; Traefik running on edge
#
# Usage:
#   docker compose up -d

services:
  marketing-nginx:
    image: nginx:1.25-alpine
    container_name: marketing-nginx
    restart: always
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.marketing.rule=Host(`qubextrack.com`) || Host(`www.qubextrack.com`)"
      - "traefik.http.routers.marketing.entrypoints=websecure"
      - "traefik.http.routers.marketing.tls.certresolver=le"
      - "traefik.http.services.marketing.loadbalancer.server.port=80"
    networks:
      - edge

networks:
  edge:
    external: true
